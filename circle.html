<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circle · Kalin</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/circle.css">
<link rel="stylesheet" href="css/pharmacy.css">
</head>
<body class="app">

<aside class="side">
  <a class="brand-mark" href="dashboard.html">
    <img class="logo" src="images/kalin-logo.png" alt="" width="36" height="36">
    <span class="wordmark">KALIN</span>
  </a>

  <nav class="nav" aria-label="Main">
    <a class="nav-item" href="dashboard.html" title="Home">
      <svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 01-2 2h-4v-6H9v6H5a2 2 0 01-2-2z"/></svg>
      <span>Home</span>
    </a>
    <a class="nav-item" href="calendar.html" title="Calendar">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      <span>Calendar</span>
    </a>
  </nav>

  <div class="side-foot">
    <button type="button" class="nav-item" id="signout" title="Sign out">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>
      <span>Sign out</span>
    </button>
  </div>
</aside>

<div class="main">
  <header class="topbar">
    <div class="welcome-group">
      <a class="back-link" href="dashboard.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        Back to Home
      </a>
    </div>

    <div class="top-actions">
      <button type="button" class="btn-handoff" id="handoff">Handoff brief</button>

      <button type="button" class="icon-btn" id="notif" aria-label="Notifications">
        <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0"/></svg>
        <span class="dot" hidden></span>
      </button>

      <button type="button" class="avatar" id="profile" aria-label="Profile">
        <span id="avatar-initial">K</span>
      </button>
    </div>
  </header>

  <main class="content">
    <p class="app-error" id="app-error" role="alert"></p>
    <div id="circle-root" aria-live="polite"></div>
  </main>
</div>

<!-- Edit details (owners only) -->
<dialog id="edit-dialog" aria-labelledby="edit-dialog-title">
  <form id="edit-form" novalidate>
    <div class="dlg-head">
      <div>
        <span class="dlg-eyebrow">Edit</span>
        <h3 id="edit-dialog-title">Circle details</h3>
      </div>
      <button type="button" class="dlg-close" id="edit-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="dlg-body">
      <label class="l" for="edit-name">Circle name</label>
      <div class="field plain">
        <input id="edit-name" type="text" maxlength="60" autocomplete="off" required>
      </div>

      <label class="l" for="edit-desc">Description <span class="opt">(optional)</span></label>
      <div class="field plain">
        <input id="edit-desc" type="text" maxlength="120" autocomplete="off" placeholder="e.g. Post-stroke recovery • Low-sodium diet">
      </div>

      <p class="hint nomatch" id="edit-error" role="alert"></p>
    </div>

    <div class="dlg-foot">
      <button type="button" class="btn-ghost" id="edit-cancel">Cancel</button>
      <button type="submit" class="btn-solid" id="edit-save">Save changes</button>
    </div>
  </form>
</dialog>

<!-- Handoff brief (AI draft) -->
<dialog id="brief-dialog" aria-labelledby="brief-dialog-title">
  <form id="brief-form" method="dialog">
    <div class="dlg-head">
      <div>
        <span class="dlg-eyebrow">AI draft</span>
        <h3 id="brief-dialog-title">Handoff brief</h3>
      </div>
      <button type="button" class="dlg-close" id="brief-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="dlg-body">
      <p class="brief-status" id="brief-status" role="status"></p>
      <div class="brief-text" id="brief-text"></div>
      <p class="hint">AI-generated draft. Not medical advice.</p>
    </div>

    <div class="dlg-foot">
      <button type="button" class="btn-ghost" id="brief-copy" disabled>Copy</button>
      <button type="button" class="btn-solid" id="brief-done">Close</button>
    </div>
  </form>
</dialog>

<!-- Add care note -->
<dialog id="note-dialog" aria-labelledby="note-dialog-title">
  <form id="note-form" novalidate>
    <div class="dlg-head">
      <div>
        <span class="dlg-eyebrow">New</span>
        <h3 id="note-dialog-title">Add a care note</h3>
      </div>
      <button type="button" class="dlg-close" id="note-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="dlg-body">
      <label class="l" for="note-body">What happened?</label>
      <textarea class="note-input" id="note-body" maxlength="2000" rows="5" placeholder="e.g. Had breakfast at 8 and took a short walk."></textarea>
      <p class="hint nomatch" id="note-error" role="alert"></p>
    </div>

    <div class="dlg-foot">
      <button type="button" class="btn-ghost" id="note-cancel">Cancel</button>
      <button type="submit" class="btn-solid" id="note-save">Save note</button>
    </div>
  </form>
</dialog>

<!-- Add medication (owners). Medicines come from the Virtual Pharmacy, never typed in. -->
<dialog id="med-dialog" aria-labelledby="med-dialog-title">
  <form id="med-form" novalidate>
    <div class="dlg-head">
      <div>
        <span class="dlg-eyebrow">New</span>
        <h3 id="med-dialog-title">Add medication</h3>
      </div>
      <button type="button" class="dlg-close" id="med-close" aria-label="Close">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>

    <div class="dlg-body">
      <p class="rx-hint" id="med-empty" hidden>
        There are no active medicines in the pharmacy yet. <a href="#" id="med-pharmacy-link">Add one in the Pharmacy</a> first.
      </p>

      <label class="l" for="med-item">Medicine</label>
      <select id="med-item" class="rx-control"></select>

      <label class="l" for="med-amount">Dose each time</label>
      <div class="rx-amount">
        <input id="med-amount" class="rx-control" type="number" min="0.25" step="0.25" inputmode="decimal">
        <span id="med-unit"></span>
      </div>

      <label class="l" for="med-frequency">How often</label>
      <select id="med-frequency" class="rx-control">
        <option value="daily">Every day</option>
        <option value="weekly">On specific days</option>
        <option value="interval">Every few days</option>
        <option value="as_needed">Only when needed</option>
      </select>

      <div id="med-days-field" hidden>
        <label class="l">Days</label>
        <div class="rx-days" id="med-days"></div>
      </div>

      <div id="med-interval-field" hidden>
        <label class="l" for="med-interval">Repeat every</label>
        <div class="rx-amount">
          <input id="med-interval" class="rx-control" type="number" min="2" max="60" step="1" value="2" inputmode="numeric">
          <span>days</span>
        </div>
      </div>

      <div id="med-times-field">
        <label class="l">Times</label>
        <div class="rx-times" id="med-times"></div>
        <button type="button" class="btn-ghost small" id="med-add-time">Add another time</button>
      </div>

      <div class="rx-row2">
        <div>
          <label class="l" for="med-start">Starts</label>
          <input id="med-start" class="rx-control" type="date">
        </div>
        <div>
          <label class="l" for="med-end">Ends <span class="opt">(optional)</span></label>
          <input id="med-end" class="rx-control" type="date">
        </div>
      </div>

      <label class="l" for="med-instructions">Instructions <span class="opt">(optional)</span></label>
      <div class="field plain">
        <input id="med-instructions" type="text" maxlength="200" autocomplete="off" placeholder="e.g. After meals">
      </div>

      <p class="hint nomatch" id="med-error" role="alert"></p>
    </div>

    <div class="dlg-foot">
      <button type="button" class="btn-ghost" id="med-cancel">Cancel</button>
      <button type="submit" class="btn-solid" id="med-save">Add medication</button>
    </div>
  </form>
</dialog>

<dialog id="todo-dialog" aria-labelledby="todo-dialog-title">
  <form id="todo-form">
    <div class="dlg-head">
      <h3 id="todo-dialog-title">Add task</h3>
      <button type="button" class="dlg-close" aria-label="Close" data-todo-close>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="dlg-body">
      <label class="l" for="todo-title">Task</label>
      <div class="field plain">
        <input id="todo-title" type="text" maxlength="120" required autocomplete="off" autofocus>
      </div>
      <label class="l" for="todo-due">Due date <span class="opt">(optional)</span></label>
      <div class="field plain">
        <input id="todo-due" type="date" min="0001-01-01" max="9999-12-31">
      </div>
      <p class="hint nomatch" id="todo-error" role="alert"></p>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn-ghost" data-todo-close>Cancel</button>
      <button type="submit" class="btn-solid" id="todo-save">Add task</button>
    </div>
  </form>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/pharmacy-core.js"></script>
<script src="js/medication.js"></script>
<script src="js/todo.js"></script>
<script src="js/circle.js"></script>
</body>
</html>
